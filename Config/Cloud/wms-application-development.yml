eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1  # Явно указываем localhost
    instance-id: ${spring.application.name}:${random.uuid}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/Warehouse
    username: postgres
    password: 12345
  jpa:
    generate-ddl: false

logging:
  level:
    org.springframework.security: trace

server:
  http2:
    enabled: true

minio:
  url: http://localhost:9000
  access:
    name: minioadmin
    secret: minioadmin
  bucket:
    images:
      name: images
    videos:
      name: videos
