plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id "org.flywaydb.flyway" version "9.22.3"
}


group = 'com.kis'
version = '0.0.1-SNAPSHOT'
description = 'WMSApplication'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Если мы делаем МОНОЛИТ, Spring Cloud нам, скорее всего, пока не нужен.
// Но я оставлю настройку правильно, если ты вдруг захочешь использовать FeignClient.
ext {
    set('springCloudVersion', "2023.0.3") // Совместимая версия для Spring Boot 3.3.x
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core:9.22.3'
    // SPRING SECURITY для авторизации на основе ролей
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // ВАЛИДАЦИЯ (Обязательно нужна для @NotNull, @Size в DTO)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // MinIO для хранения файлов (фото товаров)
    implementation 'io.minio:minio:8.6.0' // Обновил до свежей версии

    // Lombok и Postgres
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    // Тесты
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2' // Для тестов
    /*implementation 'org.springframework.cloud:spring-cloud-starter-config'*/
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // Причина: Для монолита Eureka не нужна.
}

// ЭТОГО БЛОКА НЕ ХВАТАЛО (Если решишь вернуть Cloud зависимости)
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}